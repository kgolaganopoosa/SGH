<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGH Register</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #ffffff; --text: #000000; --border: #000000; }
        body { font-family: 'Helvetica', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; border: 2px solid var(--border); padding: 20px; }
        h1 { text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        .form-group { margin-bottom: 15px; position: relative; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); box-sizing: border-box; }
        .currency-input { display: flex; align-items: center; border: 1px solid var(--border); }
        .currency-symbol { padding: 10px; background: #eee; border-right: 1px solid var(--border); }
        button { background: var(--text); color: var(--bg); border: none; padding: 10px 20px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        footer { margin-top: 40px; text-align: center; font-size: 0.75em; border-top: 1px solid #ccc; padding-top: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; padding: 20px; overflow-y: auto; }
        .close-btn { cursor: pointer; color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>SGH Register</h1>
    
    <div id="transactionForm">
        <input type="text" id="playerName" placeholder="Player Name(s)" style="margin-bottom:10px;">
        <div class="currency-input">
            <span class="currency-symbol">R</span>
            <input type="number" id="amount" placeholder="Amount Received" step="0.01">
        </div>
        <input type="number" id="games" placeholder="Number of Games" style="margin-top:10px;">
        <select id="console" style="margin-top:10px;">
            <option value="Arcade">Arcade</option>
            <option value="PS4">PS4</option>
        </select>
        <button onclick="addTransaction()">Register Transaction</button>
    </div>

    <table id="logTable">
        <thead>
            <tr><th>Name</th><th>Amount (R)</th><th>Games</th><th>Console</th><th>Date</th></tr>
        </thead>
        <tbody id="logBody"></tbody>
    </table>

    <button style="background: #555;" onclick="downloadPDF()">Download PDF</button>

    <footer>
        <p>
            <span class="close-btn" onclick="showLegal('privacy')">Privacy Policy</span> | 
            <span class="close-btn" onclick="showLegal('terms')">Terms of Use</span> | 
            <span class="close-btn" onclick="showLegal('conditions')">Terms & Conditions</span>
        </p>
    </footer>
</div>

<div id="legalModal" class="modal">
    <button onclick="document.getElementById('legalModal').style.display='none'">Close</button>
    <div id="legalContent"></div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('sgh_data')) || [];

    function addTransaction() {
        const entry = {
            name: document.getElementById('playerName').value,
            amount: document.getElementById('amount').value,
            games: document.getElementById('games').value,
            console: document.getElementById('console').value,
            date: new Date().toLocaleString()
        };
        transactions.push(entry);
        localStorage.setItem('sgh_data', JSON.stringify(transactions));
        renderTable();
    }

    function renderTable() {
        const body = document.getElementById('logBody');
        body.innerHTML = transactions.map((t, index) => `
            <tr>
                <td contenteditable="true" onblur="updateField(${index}, 'name', this.innerText)">${t.name}</td>
                <td contenteditable="true" onblur="updateField(${index}, 'amount', this.innerText)">${t.amount}</td>
                <td contenteditable="true" onblur="updateField(${index}, 'games', this.innerText)">${t.games}</td>
                <td>${t.console}</td>
                <td>${t.date}</td>
            </tr>
        `).join('');
    }

    function updateField(index, field, value) {
        transactions[index][field] = value;
        localStorage.setItem('sgh_data', JSON.stringify(transactions));
    }

    function showLegal(type) {
        const modal = document.getElementById('legalModal');
        const content = document.getElementById('legalContent');
        const policies = {
            privacy: "<h2>Privacy Policy</h2><p>Your data is stored locally on your device using browser storage. We do not transmit or sell any data to third parties.</p>",
            terms: "<h2>Terms of Use</h2><p>This tool is for personal record-keeping only. Use at your own risk.</p>",
            conditions: "<h2>Terms & Conditions</h2><p>By using SGH Register, you acknowledge that data is saved locally and clearing your browser cache may result in data loss.</p>"
        };
        content.innerHTML = policies[type];
        modal.style.display = 'block';
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("SGH Register Transaction Report", 10, 10);
        let y = 20;
        transactions.forEach(t => {
            doc.text(`${t.date} | ${t.name} | R${t.amount} | ${t.games} Games | ${t.console}`, 10, y);
            y += 10;
        });
        doc.save("SGH_Register.pdf");
    }

    renderTable();
</script>
</body>
</html>
